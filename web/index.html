<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="completai">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>completai</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { margin: 0; width: 100%; height: 100%; background: #325DFB; }
    #startup-splash {
      position: fixed; inset: 0; display: grid; place-items: center;
      background: #325DFB; color: white; font-family: Arial, sans-serif;
    }
    #startup-splash .content { text-align: center; }
    #startup-splash svg { width: 150px; height: 130px; overflow: visible; }
    #startup-splash .pump { animation: pump 1.6s ease-in-out infinite; transform-origin: center; }
    #startup-splash .hose {
      stroke-dasharray: 220; stroke-dashoffset: 220;
      animation: hose 2.4s ease-in-out infinite;
    }
    #startup-splash strong { display: block; margin-top: 10px; font-size: 28px; }
    #startup-splash span { display: block; margin-top: 8px; font-size: 13px; opacity: .72; }
    @keyframes pump { 0%,100% { transform: scale(.96); } 50% { transform: scale(1.04); } }
    @keyframes hose { 0%,12% { stroke-dashoffset: 220; } 55%,82% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: 220; } }
  </style>
</head>
<body>
  <div id="startup-splash" role="status" aria-label="Carregando Completai">
    <div class="content">
      <svg viewBox="0 0 150 130" fill="none" aria-hidden="true">
        <path class="hose" d="M91 45c45 5 46 55 9 65-31 9-61-8-63-34"
          stroke="white" stroke-width="5" stroke-linecap="round"/>
        <g class="pump">
          <rect x="55" y="16" width="40" height="60" rx="8" stroke="white" stroke-width="5"/>
          <rect x="63" y="27" width="24" height="17" rx="4" stroke="white" stroke-width="4"/>
          <path d="M95 54l9 11" stroke="white" stroke-width="5" stroke-linecap="round"/>
          <circle cx="105" cy="70" r="6" fill="#FFC53D"/>
        </g>
      </svg>
      <strong>Completai!</strong>
      <span>Preparando seu próximo abastecimento</span>
    </div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      document.getElementById('startup-splash')?.remove();
    });
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
